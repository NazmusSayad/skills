name: Sync skills from dotfiles

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skills repo
        uses: actions/checkout@v4

      - name: Clone dotfiles to temp dir
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dotfiles"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NazmusSayad/.dotfiles.git "$RUNNER_TEMP/dotfiles"
          git -C "$RUNNER_TEMP/dotfiles" sparse-checkout set --no-cone agents/skills

      - name: Sync skills
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dotfiles/agents/skills"
          test -d "$SRC" || { echo "Source not found: $SRC"; exit 1; }
          rm -rf skills
          cp -R "$SRC" skills

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore(skills): sync from dotfiles"
          git push
